<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easy Proxies - 节点监控</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>Easy Proxies</h1>
      <p>节点监控中心</p>
      <div class="header-status">
        <div class="status-line">
          <span class="status-dot"></span>
          <span id="lastUpdate">正在加载...</span>
        </div>
        <button class="btn btn-secondary btn-icon-only" onclick="switchTab('settings')" title="系统设置">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <div class="tabs">
      <button class="tab active" data-tab="monitor">📊 节点监控</button>
      <button class="tab" data-tab="manage">⚙️ 节点管理</button>
      <!-- Add more tabs later as needed -->
    </div>

    <!-- Monitor Tab -->
    <div id="monitorTab" class="tab-content active">
      <div class="controls">
        <button class="btn btn-primary" onclick="refresh()">刷新数据</button>
        <button class="btn btn-primary" id="probeAllBtn" onclick="probeAllNodes()">⚡ 探测全部</button>
        <button class="btn btn-secondary" onclick="toggleAutoRefresh()">
          <span id="autoRefreshText">关闭自动刷新</span>
        </button>
        <button class="btn btn-secondary" onclick="exportNodes()">导出节点</button>
        <button class="btn btn-secondary" onclick="toggleShowAllNodes()">
          <span id="showAllText">显示全部节点</span>
        </button>
         <button class="btn btn-danger" onclick="deleteFailedNodes()">
          删除探测失败节点
        </button>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">总节点</div>
          <div class="stat-value" id="totalNodes">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">健康节点</div>
          <div class="stat-value" style="color: var(--success);" id="healthyNodes">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">活跃连接</div>
          <div class="stat-value" style="color: var(--primary);" id="activeConnections">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">拉黑节点</div>
          <div class="stat-value" style="color: var(--error);" id="blacklistedNodes">0</div>
        </div>
      </div>

      <div id="nodesContainer" class="nodes-grid"></div>

      <div id="emptyState" class="empty" style="display: none;">
        <h3>暂无代理节点</h3>
        <p>请在"节点管理"中添加代理节点</p>
      </div>
    </div>

    <!-- Manage Tab -->
    <div id="manageTab" class="tab-content">
        <div class="controls">
            <button class="btn btn-primary" onclick="showAddNodeModal()">➕ 添加节点</button>
            <button class="btn btn-warning" onclick="triggerReload()">🔄 重载配置</button>
        </div>
        <div id="configNodesContainer" class="nodes-grid"></div>
        <div id="configEmptyState" class="empty" style="display: none;">
            <h3>暂无配置节点</h3>
            <p>点击上方"添加节点"开始使用</p>
        </div>
    </div>
    
    <!-- Settings Tab Placeholder -->
    <div id="settingsTab" class="tab-content">
         <div class="empty">
            <h3>系统设置</h3>
            <p>功能开发中...</p>
            <button class="btn btn-secondary" onclick="switchTab('monitor')">返回监控</button>
        </div>
    </div>

  </div>

  <!-- Toast -->
  <div id="toast" class="toast">
    <span id="toastMessage"></span>
  </div>

  <!-- Login Modal -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-modal">
      <div class="login-header">
        <h2>🔐 身份验证</h2>
        <p>请输入访问密码</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password" required />
        </div>
        <div id="loginError" class="login-error">密码错误，请重试</div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
      </form>
    </div>
  </div>
  
  <!-- Add/Edit Node Modal -->
  <div id="nodeModalOverlay" class="login-overlay">
      <div class="login-modal">
           <div class="login-header">
            <h2 id="nodeModalTitle">➕ 添加节点</h2>
          </div>
          <form id="nodeForm" onsubmit="handleNodeSubmit(event)">
              <div class="form-group">
                  <label class="form-label">节点名称</label>
                  <input type="text" id="nodeName" class="form-input" placeholder="例如：香港节点" required>
              </div>
              <div class="form-group">
                  <label class="form-label">节点 URI</label>
                  <input type="text" id="nodeUri" class="form-input" placeholder="vless://..." required>
              </div>
              <div class="form-group">
                  <label class="form-label">端口 (可选)</label>
                  <input type="number" id="nodePort" class="form-input" placeholder="自动分配">
              </div>
              <input type="hidden" id="nodeEditName">
              <div class="modal-buttons">
                  <button type="button" class="btn btn-secondary" onclick="hideNodeModal()">取消</button>
                  <button type="submit" class="btn btn-primary" id="nodeSubmitBtn">保存</button>
              </div>
          </form>
      </div>
  </div>

  <script src="/js/script.js"></script>
</body>
</html>
