<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Proxies - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="app-background"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <h1>Easy Proxies</h1>
                <span class="status-badge" id="system-status">Checking...</span>
            </div>
            <div class="header-actions">
                <a href="/api/export" class="icon-btn" title="Export Proxy List" target="_blank">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </a>
                <button id="btn-reload" class="icon-btn" title="Reload System">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6"></path>
                        <path d="M1 20v-6h6"></path>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
                <button id="theme-toggle" class="icon-btn" style="display:none">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <div id="auth-area"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Stats Row -->
            <section class="stats-grid" id="stats-grid">
                <!-- Injected via JS -->
            </section>

            <!-- Controls -->
            <section class="controls-area">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="monitor">监控面板</button>
                    <button class="tab-btn" data-tab="config">配置管理</button>
                    <button class="tab-btn" data-tab="subscriptions">订阅管理</button>
                    <button class="tab-btn" data-tab="settings">系统设置</button>
                </div>
                <div class="actions">
                    <label class="checkbox-label batch-toggle">
                        <input type="checkbox" id="toggle-select-all">
                        <span>全选</span>
                    </label>
                    <button class="btn btn-secondary btn-batch" id="btn-batch-probe" disabled>
                        批量探测 (<span id="batch-count">0</span>)
                    </button>
                    <button class="btn btn-primary" id="btn-probe-all">
                        <span class="icon">⚡</span> 探测所有
                    </button>
                    <button class="btn btn-secondary" id="btn-delete-failed">
                        <span class="icon">🗑️</span> 清理失效
                    </button>
                </div>
            </section>

            <!-- Views -->
            <div class="views-container">
                <!-- Monitor View -->
                <div class="view active" id="view-monitor">
                    <div class="nodes-grid" id="nodes-grid">
                        <!-- Nodes Injected via JS -->
                    </div>
                </div>

                <!-- Config View -->
                <div class="view" id="view-config">
                    <div class="config-header">
                        <h2>节点配置</h2>
                        <button class="btn btn-primary" id="btn-add-node">添加节点</button>
                    </div>
                    <div class="config-list" id="config-list">
                        <!-- Config Items -->
                    </div>
                </div>

                <!-- Subscriptions View -->
                <div class="view" id="view-subscriptions">
                    <div class="settings-card">
                        <div class="config-header">
                            <h2>订阅管理</h2>
                            <button class="btn btn-primary" id="btn-refresh-subs">
                                <span class="icon">🔄</span> 立即刷新订阅
                            </button>
                        </div>

                        <!-- Status Panel -->
                        <div class="metric-grid" id="sub-status-grid"
                            style="grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem;">
                            <!-- Injected -->
                        </div>

                        <form id="subscription-form">
                            <!-- Injected -->
                        </form>
                    </div>
                </div>

                <!-- Settings View -->
                <div class="view" id="view-settings">
                    <div class="settings-card">
                        <h2>系统设置</h2>
                        <form id="settings-form">
                            <!-- Settings Form -->
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-container"></div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
